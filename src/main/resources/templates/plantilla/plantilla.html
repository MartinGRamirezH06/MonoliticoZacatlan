<!DOCTYPE html>
<html
        xmlns:th="http://www.thymeleaf.org"
        lang="es">
<head th:fragment="head">
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <title>Title</title>
</head>
<body th:fragment="body(contenidoHTML,menuActivo)" class="admin-body">
<div class="admin-layout">
    <aside class="admin-sidebar" id="sidebar">
        <div class="sidebar-marca">
            <i class="bi bi-buildings marca-icono"></i>
            <div class="marca-texto">
                <h3>ZACATLAN</h3>
                <span>P U E B L A</span>
            </div>
        </div>
        <hr class="sidebar-division">
        <nav class="sidebar-nav">
            <th:block th:if="${usuario != null and usuario.esAdmin()}">
                <div class="side-section">TABLAS</div>
                <a th:href="@{/bloque/listar-bloque}" class="sidebar-link"
                   th:classappend="${menuActivo == 'bloques' ? 'active' : ''}">
                    <i class="bi bi-grid-fill"></i><span>Bloques</span>
                </a>
                <a th:href="@{/producto/listar-productos}" class="sidebar-link"
                   th:classappend="${menuActivo == 'productos' ? 'active' : ''}">
                    <i class="bi bi-box-seam-fill"></i><span>Productos</span>
                </a>
                <a th:href="@{/vendedor/listar-vendedores}" class="sidebar-link"
                   th:classappend="${menuActivo == 'vendedores' ? 'active' : ''}">
                    <i class="bi bi-shop"></i><span>Vendedores</span>
                </a>
                <a th:href="@{/admin/administradores}" class="sidebar-link"
                   th:classappend="${menuActivo == 'administradores' ? 'active' : ''}">
                    <i class="bi bi-person-gear"></i><span>Administradores</span>
                </a>
                <div class="side-section">REPORTES</div>
                <a th:href="@{/admin/reportes}" class="sidebar-link"
                   th:classappend="${menuActivo == 'reportes' ? 'active' : ''}">
                    <i class="bi bi-bar-chart-fill"></i><span>Reportes de ventas</span>
                </a>
                <a th:href="@{/admin/bitacora}" class="sidebar-link"
                   th:classappend="${menuActivo == 'bitacora' ? 'active' : ''}">
                    <i class="bi bi-journal-text"></i><span>Bitácora</span>
                </a>
            </th:block>
            <th:block th:if="${usuario != null and !usuario.esAdmin()}">
                <div class="side-section">VENTAS</div>
                <a th:href="@{/venta/registrar}" class="sidebar-link"
                   th:classappend="${menuActivo == 'ventas' ? 'active' : ''}">
                    <i class="bi bi-cart-plus-fill"></i><span>Registrar venta</span>
                </a>
            </th:block>
        </nav>
        <div class="sidebar-inferior">
            <a th:href="@{/logout}" class="sidebar-link">
                <i class="bi bi-buildings"></i>
                <span> Cerrar Sesion</span>
            </a>
            <div class="sidebar-slogan">
                <i class="bi bi-buildings"></i>
                <p>Juntos construimos <strong>un mejor Zacatlan</strong></p>
            </div>
        </div>
    </aside>
    <main class="admin-main">
        <header class="header_admin">
            <div class="background-image-principal"></div>
            <div class="background-difuminado-principal"></div>
            <button class="btn btn-light mobile-menu-btn"
                    type="button"
                    aria-label="Abrir Menu"
            >
                <i class="bi bi-list"></i>
            </button>
            <div class="header_admin-usuario">
                <div class="user-avatar">
                    <i class="bi bi-person-fill"></i>
                </div>
                <div class="user-info">
                    <span th:text="${usuario != null ? usuario.nombre() : 'Administrador'}">Administrador</span>
                    <small th:text="${usuario != null and usuario.esAdmin() ? 'Gestion del sistema' : (usuario != null and usuario.bloque() != null ? 'Vendedor · ' + usuario.bloque() : 'Vendedor')}">Gestion del sistema</small>
                </div>
            </div>
        </header>


        <div class="alert alert-success mx-4 mt-3" th:if="${mensaje}" th:text="${mensaje}"></div>
        <div class="alert alert-danger mx-4 mt-3" th:if="${error}" th:text="${error}"></div>
        <div th:replace="${contenidoHTML}"></div>
    </main>
</div>
<script th:fragment="scriptMovimiento" th:src="@{/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/crud.js}"></script>
</body>
</html>
