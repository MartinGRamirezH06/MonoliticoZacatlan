<!DOCTYPE html>
<html
        xmlns:th="http://www.thymeleaf.org"
        lang="en">
<head th:replace="~{plantilla/plantilla :: head}"></head>
<body th:replace="~{plantilla/plantilla :: body(~{::#contenido-dinamico},'productos')}">
<div id="contenido-dinamico">
    <section class="admin-content container-fluid">
        <div class="section-header">
            <div class="section-title">
                <div class="section-icon">
                    <i class="bi bi-box-seam-fill"></i>
                </div>
                <div>
                    <h1>Productos</h1>
                    <p>Gestiona los productos del sistema</p>
                </div>
            </div>
            <button class="btn btn-primary btn-add"
                    type="button"
                    data-bs-toogle="modal"
                    data-bs-target="#modalProducto"
            >
                <i class="bi bi-plus-lg me-2"></i>
                Agregar Producto
            </button>
        </div>

        <div class="table-search">
            <i class="bi bi-search"></i>
            <input
                    type="search"
                    class="form-control"
                    placeholder="Buscar producto"
                    id="buscarProducto"
            >
        </div>
        <div class="table-responsive">
            <table class="table admin-table align-middle">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Precio minimo</th>
                        <th>Categoria</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>01</td>
                        <td>Pambazos</td>
                        <td>30.00</td>
                        <td>Comida</td>
                        <td>
                            <div class="table-actions">
                                <button class="btn-action"
                                        title="Editar">
                                    <i class="bi bi-pencil-fill"></i>
                                </button>

                                <button class="btn-action btn-delete"
                                        title="Eliminar">
                                    <i class="bi bi-trash-fill"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td>02</td>
                        <td>Camiseta</td>
                        <td>200.00</td>
                        <td>Textil</td>
                        <td>
                            <div class="table-actions">
                                <button class="btn-action"
                                        title="Editar">
                                    <i class="bi bi-pencil-fill"></i>
                                </button>

                                <button class="btn-action btn-delete"
                                        title="Eliminar">
                                    <i class="bi bi-trash-fill"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td>03</td>
                        <td>Taza</td>
                        <td>50.00</td>
                        <td>Manualidades</td>
                        <td>
                            <div class="table-actions">
                                <button class="btn-action"
                                        title="Editar">
                                    <i class="bi bi-pencil-fill"></i>
                                </button>

                                <button class="btn-action btn-delete"
                                        title="Eliminar">
                                    <i class="bi bi-trash-fill"></i>
                                </button>
                            </div>
                        </td>
                    </tr>

                </tbody>
            </table>
        </div>



    </section>
</div>


</body>
</html>
