<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{plantilla/plantilla :: head}"></head>
<body th:replace="~{plantilla/plantilla :: body(~{::#contenido-dinamico},'productos')}">
<div id="contenido-dinamico">
    <section class="admin-content container-fluid">
        <div class="section-header">
            <div class="section-title">
                <div class="section-icon"><i class="bi bi-box-seam-fill"></i></div>
                <div>
                    <h1>Productos</h1>
                    <p>Gestiona los productos del sistema</p>
                </div>
            </div>
            <button class="btn btn-primary btn-add" type="button"
                    data-bs-toggle="modal" data-bs-target="#modalForm"
                    data-modo="crear" data-titulo="Agregar producto"
                    th:attr="data-action=@{/producto/crear}">
                <i class="bi bi-plus-lg me-2"></i> Agregar Producto
            </button>
        </div>

        <div class="table-search">
            <i class="bi bi-search"></i>
            <input type="search" class="form-control" placeholder="Buscar producto">
        </div>
        <div class="table-responsive">
            <table class="table admin-table align-middle">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Precio minimo</th>
                    <th>Categoria</th>
                    <th>Status</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${productos}">
                    <td th:text="${p.id}"></td>
                    <td th:text="${p.nombre}"></td>
                    <td th:text="${#numbers.formatDecimal(p.precio_min, 1, 2)}"></td>
                    <td th:text="${p.categoria}"></td>
                    <td>
                        <span class="status-badge" th:classappend="${p.status} ? 'status-active' : 'status-inactive'">
                            <i class="bi bi-circle-fill"></i>
                            <span th:text="${p.status} ? 'Activo' : 'Inactivo'"></span>
                        </span>
                    </td>
                    <td>
                        <div class="table-actions">
                            <button type="button" class="btn-action" title="Editar"
                                    data-bs-toggle="modal" data-bs-target="#modalForm"
                                    data-modo="editar" data-titulo="Editar producto"
                                    th:attr="data-action=@{/producto/{id}/editar(id=${p.id})},
                                             data-campo-nombre=${p.nombre},
                                             data-campo-precio_min=${p.precio_min},
                                             data-campo-categoria=${p.categoria}">
                                <i class="bi bi-pencil-fill"></i>
                            </button>
                            <form th:if="${p.status}" th:action="@{/producto/{id}/desactivar(id=${p.id})}" method="post" class="d-inline">
                                <button type="submit" class="btn-action btn-delete" title="Desactivar"
                                        onclick="return confirm('¿Desactivar este producto?')">
                                    <i class="bi bi-trash-fill"></i>
                                </button>
                            </form>
                            <form th:unless="${p.status}" th:action="@{/producto/{id}/reactivar(id=${p.id})}" method="post" class="d-inline">
                                <button type="submit" class="btn-action" title="Reactivar">
                                    <i class="bi bi-arrow-counterclockwise"></i>
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(productos)}">
                    <td colspan="6" class="text-center text-muted">No hay productos registrados</td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="modal fade" id="modalForm" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <form method="post">
                        <div class="modal-header">
                            <h5 class="modal-title"></h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                        </div>
                        <div class="modal-body">
                            <div class="mb-3">
                                <label class="form-label">Nombre</label>
                                <input type="text" class="form-control" name="nombre" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Precio minimo</label>
                                <input type="number" step="0.01" min="0" class="form-control" name="precio_min" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Categoria</label>
                                <input type="text" class="form-control" name="categoria" required>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                            <button type="submit" class="btn btn-primary">Guardar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </section>
</div>
</body>
</html>
