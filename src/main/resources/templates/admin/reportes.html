<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{plantilla/plantilla :: head}"></head>
<body th:replace="~{plantilla/plantilla :: body(~{::#contenido-dinamico},'reportes')}">
<div id="contenido-dinamico">
    <section class="admin-content container-fluid">
        <div class="section-header">
            <div class="section-title">
                <div class="section-icon"><i class="bi bi-bar-chart-fill"></i></div>
                <div>
                    <h1>Reportes de ventas</h1>
                    <p>Filtra por periodo, vendedor, bloque o producto</p>
                </div>
            </div>
        </div>

        <!-- Filtros -->
        <form th:action="@{/admin/reportes}" th:object="${filtro}" method="get" class="card border-0 shadow-sm mb-4">
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label">Periodo</label>
                        <select class="form-select" th:field="*{periodo}">
                            <option value="DIA">Día</option>
                            <option value="SEMANA">Semana</option>
                            <option value="MES">Mes</option>
                            <option value="PERSONALIZADO">Personalizado</option>
                        </select>
                    </div>
                    <div class="col-md-3 rango-fecha">
                        <label class="form-label">Fecha de referencia</label>
                        <input type="date" class="form-control" th:field="*{fecha}">
                    </div>
                    <div class="col-md-3 rango-personalizado d-none">
                        <label class="form-label">Desde</label>
                        <input type="date" class="form-control" th:field="*{desde}">
                    </div>
                    <div class="col-md-3 rango-personalizado d-none">
                        <label class="form-label">Hasta</label>
                        <input type="date" class="form-control" th:field="*{hasta}">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Agrupar por</label>
                        <select class="form-select" th:field="*{agruparPor}">
                            <option value="NINGUNO">Sin agrupar</option>
                            <option value="VENDEDOR">Vendedor</option>
                            <option value="BLOQUE">Bloque</option>
                            <option value="PRODUCTO">Producto</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Vendedor</label>
                        <select class="form-select" th:field="*{vendedorId}">
                            <option value="">Todos</option>
                            <option th:each="v : ${vendedores}" th:value="${v.id}"
                                    th:text="${v.nombre + ' ' + v.apellido_paterno}"></option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Bloque</label>
                        <select class="form-select" th:field="*{bloqueId}">
                            <option value="">Todos</option>
                            <option th:each="b : ${bloques}" th:value="${b.id}" th:text="${b.nombre}"></option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Producto</label>
                        <select class="form-select" th:field="*{productoId}">
                            <option value="">Todos</option>
                            <option th:each="p : ${productos}" th:value="${p.id}" th:text="${p.nombre}"></option>
                        </select>
                    </div>
                </div>
                <div class="d-flex gap-2 mt-3">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-funnel-fill me-2"></i> Generar reporte
                    </button>
                    <button type="submit" class="btn btn-outline-secondary" th:formaction="@{/admin/reportes/pdf}">
                        <i class="bi bi-file-earmark-pdf-fill me-2"></i> Descargar PDF
                    </button>
                </div>
            </div>
        </form>

        <!-- Resultado -->
        <div class="mb-3">
            <h5 class="mb-1" th:text="${reporte.titulo}">Reporte</h5>
            <div class="text-muted">
                <span th:text="${reporte.desde}"></span>
                <span th:if="${reporte.desde != reporte.hasta}"> al <span th:text="${reporte.hasta}"></span></span>
                &middot; <span th:text="${reporte.filtros}"></span>
            </div>
        </div>

        <div class="row g-3 mb-4">
            <div class="col-sm-6 col-lg-3">
                <div class="card border-0 shadow-sm"><div class="card-body">
                    <small class="text-muted">Número de ventas</small>
                    <div class="fs-3 fw-bold" th:text="${reporte.numeroVentas}">0</div>
                </div></div>
            </div>
            <div class="col-sm-6 col-lg-3">
                <div class="card border-0 shadow-sm"><div class="card-body">
                    <small class="text-muted">Total general</small>
                    <div class="fs-3 fw-bold"
                         th:text="'$' + ${#numbers.formatDecimal(reporte.totalGeneral, 1, 'COMMA', 2, 'POINT')}">$0.00</div>
                </div></div>
            </div>
        </div>

        <!-- Resumen agrupado -->
        <div th:if="${!#lists.isEmpty(reporte.resumen)}" class="mb-4">
            <h6 class="mb-2">Resumen por <span th:text="${#strings.toLowerCase(reporte.agruparPor)}"></span></h6>
            <div class="table-responsive">
                <table class="table admin-table align-middle">
                    <thead>
                    <tr><th>Concepto</th><th>Ventas</th><th>Total</th></tr>
                    </thead>
                    <tbody>
                    <tr th:each="r : ${reporte.resumen}">
                        <td th:text="${r.etiqueta}"></td>
                        <td th:text="${r.numeroVentas}"></td>
                        <td th:text="'$' + ${#numbers.formatDecimal(r.total, 1, 'COMMA', 2, 'POINT')}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Detalle -->
        <h6 class="mb-2">Detalle de ventas</h6>
        <div class="table-responsive">
            <table class="table admin-table align-middle">
                <thead>
                <tr>
                    <th>Fecha</th>
                    <th>Vendedor</th>
                    <th>Bloque</th>
                    <th>Producto</th>
                    <th>Cantidad</th>
                    <th>Precio unitario</th>
                    <th>Total</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="v : ${reporte.ventas}">
                    <td th:text="${v.fecha}"></td>
                    <td th:text="${v.vendedorNombre}"></td>
                    <td th:text="${v.bloqueNombre}"></td>
                    <td th:text="${v.productoNombre}"></td>
                    <td th:text="${v.cantidad}"></td>
                    <td th:text="'$' + ${#numbers.formatDecimal(v.precioUnitario, 1, 'COMMA', 2, 'POINT')}"></td>
                    <td th:text="'$' + ${#numbers.formatDecimal(v.total, 1, 'COMMA', 2, 'POINT')}"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(reporte.ventas)}">
                    <td colspan="7" class="text-center text-muted">No hay ventas con estos filtros</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</div>
</body>
</html>
